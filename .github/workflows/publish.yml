# Builds the inference image and publishes it to GitHub Container Registry (ghcr.io/<owner>/zsh-localghost).
# Not run yet: it needs the repository to exist on GitHub. Packages: write is granted by GITHUB_TOKEN, no secret needed.
name: publish-image
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['server/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zsh-localghost
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64   # arm64 needs docker/setup-qemu-action and a base image that has it: not verified yet
